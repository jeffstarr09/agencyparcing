name: Health check

# The feedback channel.
#
# Once a week this reads the workbook, works out what the pipeline is getting
# wrong, and files it as a GitHub issue - one issue, updated in place, so it
# reads as a running log rather than a pile of notifications.
#
# The issue is written to be actionable by a person or by a Claude Code session:
# it names the broken selector, the agencies the static parse cannot read, and
# the clients you told us we missed. Point a session at the issue and it has
# everything it needs to fix the thing without going and looking first.
on:
  schedule:
    # Mondays 10:00 UTC, an hour after the pixel check.
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the regression suite
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python tests/test_sheets_upsert.py
            python tests/test_feedback.py
            python tests/test_extractors.py
          } 2>&1 | tee test_output.txt

      - name: Write Google credentials
        id: creds
        continue-on-error: true
        env:
          SA_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::warning::GCP_SERVICE_ACCOUNT_JSON not set - reporting from \
          local state only, without the workbook."
            exit 1
          fi
          printf '%s' "$SA_JSON" > service_account.json

      - name: Fold in any new verdicts from the Feedback tab
        id: learn
        if: steps.creds.outcome == 'success'
        continue-on-error: true
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: python feedback.py --learn --from-sheet

      - name: Build the report
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: |
          if [ "${{ steps.creds.outcome }}" = "success" ]; then
            python feedback.py --report --from-sheet -o feedback_report.md
          else
            python feedback.py --report -o feedback_report.md
          fi

      - name: Commit anything the run learned
        # Learned rules are state worth keeping: they are what stops you
        # re-reviewing the same wrong row next week.
        if: steps.learn.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data/learned_rules.json data/source_health.json; then
            git add data/learned_rules.json data/source_health.json
            git commit -m "Learn from this week's review verdicts"
            git push
          else
            echo "Nothing new learned this week."
          fi

      - name: File the report as an issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('feedback_report.md', 'utf8');

            const testsPassed = '${{ steps.tests.outcome }}' === 'success';
            if (!testsPassed) {
              const out = fs.existsSync('test_output.txt')
                ? fs.readFileSync('test_output.txt', 'utf8').slice(-6000)
                : '(no output captured)';
              body = '## The regression suite is failing\n\n'
                + 'An extractor changed behaviour. Fix this before trusting '
                + 'anything below.\n\n<details><summary>Test output</summary>\n\n'
                + '```\n' + out + '\n```\n\n</details>\n\n---\n\n' + body;
            }
            if ('${{ steps.creds.outcome }}' !== 'success') {
              body = '> Built without the workbook - `GCP_SERVICE_ACCOUNT_JSON` '
                + 'is not set, so the Clients and Agencies sections are missing.\n\n'
                + body;
            }
            body += `\n\n---\n<sub>Run [#${context.runNumber}](`
              + `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}). Updated in place each week.</sub>`;

            const title = 'Pipeline health report';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-report', per_page: 10,
            });

            if (existing.data.length) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body,
              });
              // A comment so it surfaces in notifications; the body holds current state.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: testsPassed
                  ? 'Weekly health report updated above.'
                  : ':red_circle: **The regression suite is failing.** See the body above.',
              });
              core.notice(`Updated issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['health-report'],
              });
              core.notice(`Opened issue #${created.data.number}`);
            }

      - name: Attach the report to the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feedback-report
          path: |
            feedback_report.md
            test_output.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Clean up credentials
        if: always()
        run: rm -f service_account.json

      - name: Fail the run if the regression suite failed
        # Reported first, then failed - so the issue is filed either way.
        if: steps.tests.outcome != 'success'
        run: |
          echo "::error::Regression suite failed. See the health report issue."
          exit 1
